name: Deploy Updater Installer Page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "updater-installers.html"
      - "Installer/**"
      - ".github/workflows/deploy-updater-installers.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static page
        shell: bash
        run: |
          mkdir -p _site
          cp updater-installers.html _site/updater-installers.html
          mkdir -p _site/Installer
          cp -R Installer/. _site/Installer/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./updater-installers.html">
              <title>Tampermonkey Installers</title>
            </head>
            <body>
              <p><a href="./updater-installers.html">Open Tampermonkey Installers</a></p>
            </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
